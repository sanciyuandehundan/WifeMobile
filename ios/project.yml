# XcodeGen: `xcodegen generate` writes Wife.xcodeproj (not kept in git).
name: Wife
options:
  bundleIdPrefix: io.wife
  deploymentTarget:
    iOS: "16.0"
packages:
  WifeLink:
    path: WifeLink
  Opus:
    url: https://github.com/alta/swift-opus
    exactVersion: 0.0.2
targets:
  Wife:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: WifeLink
      - package: Opus
        product: Copus
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Wife
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, fetch]
        BGTaskSchedulerPermittedIdentifiers: [io.wife.mobile.fetch]
        NSMicrophoneUsageDescription: 打电话和发语音时用，你的声音传给电脑上的她。
        NSCameraUsageDescription: 扫电脑上的配对码，拍照片发给她。
        NSLocalNetworkUsageDescription: 在家时直接连电脑上的她。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.wife.mobile
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
